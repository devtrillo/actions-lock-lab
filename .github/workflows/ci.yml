name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: $/.github/actions/setup-runtime
      - run: echo "hello from a locked workflow"
      - uses: actions/upload-artifact@v4
        with:
          name: hello
          path: README.md
